<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dónde Maña | Menú</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#0b1426;--sf:#14213b;--bd:#26365a;--tx:#fff6e8;--mu:#a9b6d0;--rd:#e03a3e;--gd:#f7b32b;--bl:#1d3c78}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:500 16px/1.45 Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0)}
.hero{text-align:center;padding:36px 20px 40px;background:linear-gradient(var(--bl),var(--bg))}
.hero img{width:140px;height:140px;border-radius:50%;border:4px solid var(--gd);box-shadow:0 8px 24px #0008}
.hero h1{font-size:clamp(40px,11vw,76px);line-height:1;margin-top:12px;text-transform:uppercase}
.hero h1 span{color:var(--gd)}
.hero p{max-width:480px;margin:10px auto 18px;color:var(--mu)}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--rd);color:#fff;font:700 17px Fredoka,sans-serif;text-decoration:none;border:0;cursor:pointer}
.bd{margin-top:14px;color:var(--gd);font-weight:600;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:600 15px Fredoka,sans-serif;cursor:pointer}
.chip.on{background:var(--rd);border-color:var(--rd)}
.sr{padding:0 16px;max-width:1000px;margin:auto}
.sr input,.fm input,.fm textarea{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:500 16px Fredoka,sans-serif}
main{max-width:1000px;margin:0 auto;padding:0 16px 130px}
section{scroll-margin-top:140px;padding-top:30px}
h2{font-size:clamp(28px,7vw,42px);text-transform:uppercase;color:var(--gd);display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:4px;border-radius:4px;background:var(--rd)}
.note{color:var(--mu);margin:6px 0}
.grid{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{display:flex;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px}
.tx{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.nm{font-weight:700;font-size:18px;line-height:1.2}.ds{color:var(--mu);font-size:14.5px}
.tg b{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--gd);color:#111}
.bt{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.pr{font-size:26px;font-weight:700;color:var(--gd)}
.ph{flex:none;width:104px;height:104px;border-radius:12px;background:#0f1a31;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;font-size:11px}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.add{width:40px;height:40px;border-radius:50%;border:0;background:var(--rd);color:#fff;font:700 24px/1 Fredoka,sans-serif;cursor:pointer}
.qt{display:flex;align-items:center;gap:10px;font-weight:700}
.qt button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--rd);background:none;color:var(--tx);font:700 20px/1 Fredoka,sans-serif;cursor:pointer}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));z-index:40;display:none;justify-content:space-between;padding:15px 20px;border-radius:16px;background:var(--rd);color:#fff;font:700 17px Fredoka,sans-serif;border:0;cursor:pointer;max-width:560px;margin:auto;box-shadow:0 8px 24px #0008}
.bar.s{display:flex}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.s{display:flex}
.pn{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0))}
.pn h3{font-size:28px;color:var(--gd);margin-bottom:6px}
.ln{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.tt{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding:14px 0}
.mode{display:flex;gap:8px;margin:6px 0 10px}
.mode button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:600 16px Fredoka,sans-serif;cursor:pointer}
.mode button.on{background:var(--gd);border-color:var(--gd);color:#111}
.fm{display:grid;gap:8px}.fm textarea{resize:none;height:64px}
.er{color:#ff8a8a;font-size:14px;min-height:18px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.act .wa{flex:1;background:#128c4a}
.act .sec{padding:12px 16px;border-radius:999px;border:1.5px solid var(--bd);background:none;color:var(--tx);font:600 15px Fredoka,sans-serif;cursor:pointer}
footer{background:#070d1a;color:var(--mu);text-align:center;padding:28px 18px 100px;font-size:14px;line-height:1.7}
footer a{color:var(--gd)}
</style></head><body>

<h1>Dónde <span>Maña</span></h1>
<p>Perros, jumbos, salchipapas y hamburguesas. Elige, agrega a tu pedido y envíalo por WhatsApp.</p>

<main id="menu"></main>
<footer>📲 <a href="https://wa.me/584125889213" target="_blank" rel="noopener">0412-5889213</a> · <a href="https://instagram.com/dondemana" target="_blank" rel="noopener">@dondemana</a><br>Platos, precios y disponibilidad sujetos a cambios.<br>Menú digital preparado por visCam.</footer>
<button class="bar" id="bar"></button>
<div class="ov" id="ov"><div class="pn" id="pn"></div></div>
<script>
const WA='584125889213'; // WhatsApp del negocio
const IC={dog:'<path d="M8 36a6 6 0 0 1 6-6h36a6 6 0 0 1 0 12H14a6 6 0 0 1-6-6z"/><path d="M12 36q6-6 12 0t12 0 12 0"/>',fries:'<path d="M16 26l4 30h24l4-30z"/><path d="M22 26V12M30 26V8M38 26V12M46 26V16"/>',burger:'<path d="M10 28a22 18 0 0 1 44 0z"/><path d="M8 36h48M10 44h44"/><path d="M12 44a6 6 0 0 0 6 6h28a6 6 0 0 0 6-6"/>'};
// Cada plato: [nombre, descripción, precio, etiqueta, porciones, foto]  (foto = "archivo.jpg", opcional)
const M=[
{id:'perros',n:'Perros calientes',ic:'dog',it:[['Perro pequeño sencillo','',2.5,'Sencillo'],['Perro pequeño especial','',4.5,'Especial']]},
{id:'jumbos',n:'Jumbos',ic:'dog',it:[['Jumbo sencillo','',3.5,'Sencillo'],['Jumbo especial','',5,'Especial']]},
{id:'salchi',n:'Salchipapas',ic:'fries',it:[['Salchipapa pequeña','',7,'','Para 1'],['Salchipapa grande','',13,'','Para compartir']]},
{id:'burgers',n:'Hamburguesas',ic:'burger',it:[['Hamburguesa de pollo','',7]]}];
const $=s=>document.querySelector(s),money=n=>'$'+(Number.isInteger(n)?n:n.toFixed(2).replace('.',','));
const item=k=>{const[c,i]=k.split('-');return M[c].it[i]};
let cart={},f={mode:'Delivery',name:'',addr:'',note:''};
try{cart=JSON.parse(localStorage.getItem('dm_cart')||'{}');f=Object.assign(f,JSON.parse(localStorage.getItem('dm_form')||'{}'))}catch(e){}
Object.keys(cart).forEach(k=>{try{item(k)}catch(e){delete cart[k]}});
const save=()=>{try{localStorage.setItem('dm_cart',JSON.stringify(cart));localStorage.setItem('dm_form',JSON.stringify(f))}catch(e){}};
const tot=()=>Object.keys(cart).reduce((a,k)=>a+cart[k]*item(k)[2],0);
function card(ci,ii){const c=M[ci],[n,d,p,t,s,img]=c.it[ii],k=ci+'-'+ii,q=cart[k]||0;
const tg=[t,s].filter(Boolean).map(x=>'<b>'+x+'</b>').join(' ');
const ctl=q?`<div class="qt"><button data-a="-" data-k="${k}" aria-label="Quitar uno">−</button>${q}<button data-a="+" data-k="${k}" aria-label="Agregar uno">+</button></div>`:`<button class="add" data-a="+" data-k="${k}" aria-label="Agregar ${n}">+</button>`;
const ph=img?`<img src="${img}" alt="${n}" loading="lazy">`:`<svg viewBox="0 0 64 64">${IC[c.ic]}</svg><span>Foto del plato</span>`;
return `<article class="card" data-c="${k}"><div class="tx"><div class="nm">${n}</div>${d?`<div class="ds">${d}</div>`:''}${tg?`<div class="tg">${tg}</div>`:''}<div class="bt"><span class="pr">${money(p)}</span>${ctl}</div></div><div class="ph">${ph}</div></article>`}
$('#menu').innerHTML=M.map((c,ci)=>`<section id="${c.id}"><h2>${c.n}</h2>${c.note?`<p class="note">${c.note}</p>`:''}<div class="grid">${c.it.map((_,ii)=>card(ci,ii)).join('')}</div></section>`).join('');
$('#chips').innerHTML=M.map(c=>`<button class="chip" data-s="${c.id}">${c.n}</button>`).join('');
function msg(){const ks=Object.keys(cart);
return `Hola Dónde Maña 👋, quiero hacer este pedido:\n`+ks.map(k=>`• ${cart[k]} x ${item(k)[0]} (${money(cart[k]*item(k)[2])})`).join('\n')+`\n\n*Total: ${money(tot())}*\nModalidad: ${f.mode}`+(f.name?`\nNombre: ${f.name}`:'')+(f.mode==='Delivery'&&f.addr?`\nDirección: ${f.addr}`:'')+(f.note?`\nNotas: ${f.note}`:'')+(f.mode==='Delivery'?'\n(Por favor confírmenme el costo del delivery)':'')}
function sheet(){const ks=Object.keys(cart),d=f.mode==='Delivery';
$('#pn').innerHTML=`<h3>Mi pedido</h3>${ks.map(k=>`<div class="ln"><span>${item(k)[0]}<br><small>${money(item(k)[2])} c/u</small></span><div class="qt"><button data-a="-" data-k="${k}">−</button>${cart[k]}<button data-a="+" data-k="${k}">+</button></div></div>`).join('')}<div class="tt"><span>Total</span><span>${money(tot())}</span></div>
<div class="mode"><button data-m="Delivery" class="${d?'on':''}">🛵 Delivery</button><button data-m="Retiro" class="${d?'':'on'}">🏪 Retiro</button></div>
<div class="fm"><input id="fn" placeholder="Tu nombre" value="${f.name}">${d?`<input id="fa" placeholder="Dirección o punto de referencia" value="${f.addr}">`:''}<textarea id="fo" placeholder="Notas (sin cebolla, extra salsa…)">${f.note}</textarea></div>
<div class="er" id="er"></div><div class="act"><button class="btn wa" id="go">Enviar por WhatsApp</button><button class="sec" id="cl">Seguir viendo</button><button class="sec" id="em">Vaciar</button></div>`}
function upd(){const ks=Object.keys(cart),n=ks.reduce((a,k)=>a+cart[k],0);
$('#bar').className='bar'+(n?' s':'');$('#bar').innerHTML=`<span>Ver mi pedido (${n})</span><span>${money(tot())}</span>`;
if($('#ov').classList.contains('s'))sheet();if(!n)$('#ov').classList.remove('s');save()}
document.addEventListener('click',e=>{const t=e.target;
let x=t.closest('[data-s]');if(x){document.getElementById(x.dataset.s).scrollIntoView();return}
if(x=t.closest('[data-m]')){f.mode=x.dataset.m;sheet();save();return}
if(x=t.closest('[data-a]')){const k=x.dataset.k;cart[k]=(cart[k]||0)+(x.dataset.a==='+'?1:-1);if(cart[k]<=0)delete cart[k];
const el=document.querySelector(`[data-c="${k}"]`);if(el){const[c,i]=k.split('-');el.outerHTML=card(c,i)}upd();return}
if(t.id==='cl')$('#ov').classList.remove('s');
if(t.id==='em'){cart={};document.querySelectorAll('[data-c]').forEach(el=>{const[c,i]=el.dataset.c.split('-');el.outerHTML=card(c,i)});upd()}
if(t.id==='go'){if(!f.name.trim()){$('#er').textContent='Escribe tu nombre para enviar el pedido.';return}
if(f.mode==='Delivery'&&!f.addr.trim()){$('#er').textContent='Escribe tu dirección para el delivery.';return}
window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg()),'_blank')}});
document.addEventListener('input',e=>{const m={fn:'name',fa:'addr',fo:'note'}[e.target.id];if(m){f[m]=e.target.value;save()}});
$('#bar').onclick=()=>{sheet();$('#ov').classList.add('s')};
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('s')};
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=!v||c.textContent.toLowerCase().includes(v)?'':'none');
document.querySelectorAll('section').forEach(s=>s.style.display=!v||[...s.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none')};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.s===x.target.id;c.classList.toggle('on',on);if(on)c.scrollIntoView({inline:'center',block:'nearest'})})}),{rootMargin:'-35% 0px -60% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
upd();
</script></body></html>
